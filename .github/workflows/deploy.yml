name: Build and upload to world4you

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site
        run: |
          pip install --quiet pillow==11.0.0
          python source/build.py
          TARGET=live python source/build.py

      - name: Check FTP password secret
        env:
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$P" ]; then echo "::error::Secret FTP_PASSWORD is empty or missing (must be a Repository secret)"; exit 1; fi
          case "$P" in *" "|" "*) echo "::warning::FTP_PASSWORD starts or ends with a space";; esac
          echo "FTP_PASSWORD is set (${#P} characters)"

      - name: Upload to www.wuha.world/2027/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.world4you.com
          username: ftp2463261
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./site/
          server-dir: ./2027/

      - name: Upload WordPress plugin wuha-subscribe (newsletter)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.world4you.com
          username: ftp2463261
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./wordpress-plugin/
          server-dir: ./wp-content/plugins/wuha-subscribe/

      - name: Upload live site to www.wuha.world (web root, next to WordPress)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.world4you.com
          username: ftp2463261
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./site-live/
          server-dir: ./

      - name: Make the static site the homepage (.htaccess, once, with backup)
        env:
          FTP_USER: ftp2463261
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          H=ftp://ftp.world4you.com
          curl -sS --ssl-reqd --user "$FTP_USER:$FTP_PASSWORD" "$H/.htaccess" -o htaccess.current
          if grep -q "BEGIN WUHA static site" htaccess.current; then echo ".htaccess already set up"; exit 0; fi
          curl -sS --ssl-reqd --user "$FTP_USER:$FTP_PASSWORD" -T htaccess.current "$H/.htaccess-before-wuha"
          { cat source/htaccess-wuha.txt; echo; cat htaccess.current; } > htaccess.new
          curl -sS --ssl-reqd --user "$FTP_USER:$FTP_PASSWORD" -T htaccess.new "$H/.htaccess"
          echo "Patched .htaccess (backup: .htaccess-before-wuha)"
